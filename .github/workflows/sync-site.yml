name: Sync site/ to docs/

on:
  push:
    paths:
      - "site/**"
    workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy site/index.html into docs/
        run: |
          mkdir -p docs
          cp site/index.html docs/index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: sync site/ → docs/ for gh-pages"
          file_pattern: docs/index.html
