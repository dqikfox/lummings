<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Pip the Lumming (calm)">
<defs>
    <radialGradient id="bg-pip-calm" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.27"/>
        <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="fur-pip-calm" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#a7f3d0"/>
        <stop offset="60%" stop-color="#34d399"/>
        <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <radialGradient id="cheek-pip-calm" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fb7185" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
</defs>

<!-- Glow background -->
<rect width="240" height="240" fill="url(#bg-pip-calm)"/>

<!-- Sparkles -->


<!-- Body shadow -->
<ellipse cx="120" cy="225" rx="70" ry="6" fill="#000" opacity="0.15"/>

<!-- Main fur ball -->
<circle cx="120" cy="132" r="91" fill="url(#fur-pip-calm)" stroke="#047857" stroke-width="2"/>

<!-- Fur tufts (texture) -->
<g opacity="0.4" stroke="#047857" stroke-width="1" fill="none">
    <path d="M50,110 Q55,100 60,108"/>
    <path d="M180,120 Q185,108 192,116"/>
    <path d="M40,150 Q46,142 52,150"/>
    <path d="M188,158 Q194,148 200,154"/>
    <path d="M120,40 Q126,32 132,40"/>
    <path d="M85,200 Q92,210 100,205"/>
    <path d="M155,200 Q148,210 140,205"/>
</g>

<!-- Signature accessory -->
<path d="M85,50 L95,30 L110,45 L120,25 L130,45 L145,30 L155,50 Z" fill="#f59e0b" stroke="#047857" stroke-width="2" stroke-linejoin="round"/><circle cx="120" cy="30" r="3" fill="#fff"/><circle cx="100" cy="38" r="2" fill="#fff"/><circle cx="140" cy="38" r="2" fill="#fff"/>

<!-- Cheeks -->
<ellipse cx="78" cy="135" rx="14" ry="10" fill="url(#cheek-pip-calm)"/>
<ellipse cx="162" cy="135" rx="14" ry="10" fill="url(#cheek-pip-calm)"/>

<!-- Eyes -->
<ellipse cx="92" cy="106" rx="11" ry="10" fill="#022c22"/><ellipse cx="148" cy="106" rx="11" ry="10" fill="#022c22"/><circle cx="95" cy="103" r="4" fill="#fff"/><circle cx="151" cy="103" r="4" fill="#fff"/><circle cx="89" cy="109" r="1.5" fill="#fff" opacity="0.6"/><circle cx="145" cy="109" r="1.5" fill="#fff" opacity="0.6"/>

<!-- Brows -->


<!-- Mouth -->
<path d="M108,152 Q120,154 132,152" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- Tiny freckles/sparkles on body -->
<g opacity="0.5" fill="#a7f3d0">
    <circle cx="100" cy="180" r="2"/>
    <circle cx="140" cy="180" r="2"/>
    <circle cx="115" cy="195" r="1.5"/>
    <circle cx="130" cy="195" r="1.5"/>
</g>

<!-- Highlight sheen on body -->
<ellipse cx="95" cy="80" rx="22" ry="14" fill="#fff" opacity="0.15"/>
</svg>