<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="The Lummings">
  <title>The Lummings — Little friends from a brighter tomorrow</title>
  <defs>
    <linearGradient id="stargrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb86c"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- wordmark body, slightly playful rounded -->
  <g fill="url(#stargrad)" filter="url(#glow)">
    <text x="20" y="92" font-family="'Comfortaa','Quicksand','Segoe UI',sans-serif"
          font-weight="700" font-size="68" letter-spacing="-1">The</text>
    <text x="138" y="92" font-family="'Comfortaa','Quicksand','Segoe UI',sans-serif"
          font-weight="700" font-size="68" letter-spacing="-1">Lummings</text>
  </g>

  <!-- i-dot glow stars above each 'i' in 'Lummings' (positions approximated) -->
  <g fill="#ffb86c" filter="url(#glow)">
    <circle cx="265" cy="32" r="4"/>
    <circle cx="311" cy="32" r="4"/>
  </g>

  <!-- tagline -->
  <text x="20" y="128" font-family="'Quicksand','Segoe UI',sans-serif"
        font-size="18" fill="#8be9fd" letter-spacing="0.5" font-style="italic">
    Little friends from a brighter tomorrow.
  </text>

  <!-- corner star -->
  <g transform="translate(440,32)" fill="#ffb86c" filter="url(#glow)">
    <path d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z"/>
  </g>
</svg>
